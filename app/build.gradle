apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-parcelize'

apply plugin: 'kotlin-kapt'

apply plugin: 'androidx.navigation.safeargs.kotlin'

// API keys live in local.properties (gitignored). See local.properties.example.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def localProp = { String key -> localProps.getProperty(key, '') }
def googleCloudCredentialsBase64 = {
    def path = localProp('GOOGLE_CLOUD_CREDENTIALS_FILE')
    def file = path ? rootProject.file(path) : null
    return (file != null && file.exists()) ? file.bytes.encodeBase64().toString() : ''
}

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"
    defaultConfig {
        applicationId "kz.narrator.app"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 11
        versionName "1.0.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true

        buildConfigField "String", "OPENAI_API_KEY", "\"${localProp('OPENAI_API_KEY')}\""
        buildConfigField "String", "ELEVENLABS_API_KEY", "\"${localProp('ELEVENLABS_API_KEY')}\""
        buildConfigField "String", "ELEVENLABS_BASE_URL", '"https://api.elevenlabs.io/"'
        buildConfigField "String", "GOOGLE_CLOUD_CREDENTIALS_BASE64", "\"${googleCloudCredentialsBase64()}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "default"

    productFlavors {
        dev {
            dimension "default"
            applicationId "kz.narrator.app"
            buildConfigField "String", "FILE_PROVIDER", '"kz.narrator.app.dev.fileprovider"'
            manifestPlaceholders = [manifestFileProvider: "kz.narrator.app.dev.fileprovider"]
        }
        prod {
            dimension "default"
            applicationId "kz.narrator.app"
            buildConfigField "String", "FILE_PROVIDER", '"kz.narrator.app.fileprovider"'
            manifestPlaceholders = [manifestFileProvider: "kz.narrator.app.fileprovider"]
        }
    }

    dataBinding {
        enabled = true
    }

//    androidExtensions {
//        experimental = true
//    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // dynamic feature APK.
            enableSplit = false
        }
    }
    packagingOptions {
        resources.excludes.add("META-INF/*")
    }
}

apply from: '../versions.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    testImplementation "junit:junit:$jUnitVersion"
    androidTestImplementation "androidx.test:runner:$testRunnerVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoCoreVersion"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0-alpha09"
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.cardview:cardview:$androidxCardview"
    implementation "androidx.multidex:multidex:$androidxMultidex"
    implementation "androidx.viewpager:viewpager:$viewpager"

    implementation "com.google.android.material:material:$androidMaterial"

    //KTX
    implementation "androidx.core:core-ktx:1.10.0"
    implementation "androidx.fragment:fragment-ktx:1.5.4"

    //ARCH COMPONENTS
    //-> ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.4.0"

    kapt "androidx.lifecycle:lifecycle-compiler:2.4.0"

    //-> db
    implementation "androidx.room:room-runtime:2.5.1"
    kapt "androidx.room:room-compiler:2.5.1"

    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:2.5.1"

    //-> scheduler
//    implementation "android.arch.work:work-runtime:$workRuntimeVersion"

    //-> navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.5.3"
    implementation "androidx.navigation:navigation-ui-ktx:2.5.3"

    //NETWORK
