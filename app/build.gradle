apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-parcelize'

apply plugin: 'kotlin-kapt'

apply plugin: 'androidx.navigation.safeargs.kotlin'

apply plugin: 'com.google.gms.google-services'

//apply plugin: 'com.onesignal.androidsdk.onesignal-gradle-plugin'

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.3"
    defaultConfig {
        applicationId "kz.narrator.app"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 11
        versionName "1.0.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "default"

    productFlavors {
        dev {
            dimension "default"
            applicationId "kz.narrator.app"
            buildConfigField "String", "URL_BASE", '"https://example.com/api/"'
            buildConfigField "boolean", "IS_DEBUG", "true"
            buildConfigField "String", "FILE_PROVIDER", '"kz.narrator.app.dev.fileprovider"'
            manifestPlaceholders = [manifestFileProvider: "kz.narrator.app.dev.fileprovider"]
        }
        prod {
            dimension "default"
            applicationId "kz.narrator.app"
            buildConfigField "String", "URL_BASE", '"https://example.com/api/"'
            buildConfigField "boolean", "IS_DEBUG", "true"
            buildConfigField "String", "FILE_PROVIDER", '"kz.narrator.app.fileprovider"'
            manifestPlaceholders = [manifestFileProvider: "kz.narrator.app.fileprovider"]
        }
    }

    dataBinding {
        enabled = true
    }

//    androidExtensions {
//        experimental = true
//    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

//    android {
//        defaultConfig {
//            manifestPlaceholders = [
//                onesignal_app_id: '***REMOVED***',
//                onesignal_google_project_number: 'REMOTE'
//            ]
//        }
//    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // dynamic feature APK.
            enableSplit = false
        }
    }
}

apply from: '../versions.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    testImplementation "junit:junit:$jUnitVersion"
    androidTestImplementation "androidx.test:runner:$testRunnerVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espressoCoreVersion"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0-alpha09"
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation "androidx.cardview:cardview:$androidxCardview"
    implementation "androidx.multidex:multidex:$androidxMultidex"
    implementation "androidx.viewpager:viewpager:$viewpager"

    implementation "com.google.android.material:material:$androidMaterial"
    implementation "com.google.android:flexbox:$androidFlexbox"

    //KTX
    implementation "androidx.core:core-ktx:1.10.0"
    implementation "androidx.fragment:fragment-ktx:1.5.4"

    //ARCH COMPONENTS
    //-> ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.4.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.4.0"

    kapt "androidx.lifecycle:lifecycle-compiler:2.4.0"

    //-> db
    implementation "androidx.room:room-runtime:2.5.1"
    kapt "androidx.room:room-compiler:2.5.1"

    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:2.5.1"

    //-> scheduler
//    implementation "android.arch.work:work-runtime:$workRuntimeVersion"

    //-> navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.5.3"
    implementation "androidx.navigation:navigation-ui-ktx:2.5.3"

    //NETWORK
    //-> retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.7.1"

    //-> okhttp
    implementation "com.squareup.okhttp3:okhttp:$okhttp3"
    implementation "com.squareup.okhttp3:logging-interceptor:4.9.1"

    //DAGGER 2
    implementation "com.google.dagger:dagger:2.43.2"
    kapt "com.google.dagger:dagger-compiler:2.43.2"

    //-> dagger.android package (optional)
    implementation "com.google.dagger:dagger-android:2.43.2"
    kapt "com.google.dagger:dagger-android-processor:2.43.2"

    //-> Support library support (optional), if you use the support libraries
    implementation "com.google.dagger:dagger-android-support:2.43.2"

    //IMAGE
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    kapt "com.github.bumptech.glide:compiler:$glideVersion"

    implementation "jp.wasabeef:glide-transformations:$glideTransformationsVersion"

    //ANIMATION
    implementation "com.airbnb.android:lottie:$lottieVersion"

    //UTILS
    implementation "com.redmadrobot:inputmask:$inputMaskVersion"
    implementation "com.romandanylyk:pageindicatorview:$pageindicatorviewVersion"

    implementation "net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:2.3.0"

    //Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutineVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutineVersion"

    //otp
    implementation "com.github.aabhasr1:OtpView:1.0.6"

    //
    api "androidx.viewpager2:viewpager2:1.0.0-alpha05"

    implementation 'com.applandeo:material-calendar-view:1.6.0'

    //Sms Retriever
    implementation "com.google.android.gms:play-services-auth-api-phone:18.0.1"

    //Google Maps
    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    implementation 'com.google.android.gms:play-services-location:17.0.0'

    //Dots Indicator
    implementation 'com.tbuonomo.andrui:viewpagerdotsindicator:4.1.2'

    implementation 'gun0912.ted:tedbottompicker:2.0.1'

    //Firebase
    implementation platform('com.google.firebase:firebase-bom:28.2.0')
    implementation 'com.google.firebase:firebase-analytics'

    //Firebase - Auth
    implementation 'com.google.firebase:firebase-auth:19.0.0'
    implementation 'com.google.android.gms:play-services-auth:19.0.0'
    //Facebook Auth sdk
    implementation 'com.facebook.android:facebook-android-sdk:[5,6)'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation("com.google.firebase:firebase-iid")

    //Motion Layout
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha09'

    //HTML parser
    implementation 'org.jsoup:jsoup:1.13.1'

    //chart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // mask
    implementation 'ru.egslava:MaskedEditText:1.0.5'
    implementation 'ru.egslava:MaskedEditText:1.0.5'

    //onesignal
//    implementation 'com.onesignal:OneSignal:3.11.4'


    //OPEN_AI
    implementation "com.aallam.openai:openai-client:3.6.2"
    // Ktor client for Android
    implementation "io.ktor:ktor-client-android:2.3.0"

    //mediaPlayer
//    implementation 'com.devbrackets.android:exomedia:5.1.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    //FFmpeg Library
//    implementation 'com.writingminds:FFmpegAndroid:0.3.2'
//    implementation 'com.arthenica:mobile-ffmpeg-full:4.3'
    implementation 'com.arthenica:mobile-ffmpeg-full-gpl:4.4'
//    implementation 'com.arthenica:ffmpeg-kit-full:6.0-2'
    implementation 'org.jcodec:jcodec-android:0.1.9'

}